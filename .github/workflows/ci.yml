name: M-2LRF CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade core build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU PyTorch and dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate scipy pytest pytest-cov

      - name: Install package in editable mode (Packaging Verification)
        run: |
          pip install -e . --no-deps

      - name: Verify clean package imports and metadata
        run: |
          python -c "import m2lrf; print('Loaded M-2LRF v' + m2lrf.__version__); assert len(m2lrf.__all__) > 0"

      - name: Run Pytest test suite
        run: |
          pytest tests/ -v --color=yes
